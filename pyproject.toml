[project]
name = "marimo-agent-kit"
version = "0.6.0"
description = "Contrôles, outils MCP, skills et hook pour que les agents écrivent des notebooks marimo justes et lisibles."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
# `audit()` s'appelle depuis un notebook, où marimo est déjà là ; le reste n'en a pas besoin.
marimo = ["marimo>=0.25"]

[project.scripts]
mak = "marimo_agent_kit.cli:main"
marimo-agent-kit = "marimo_agent_kit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marimo_agent_kit"]

[tool.hatch.build.targets.wheel.force-include]
# Les skills vivent à la racine du dépôt (format Agent Skills) et voyagent dans le paquet.
"skills" = "marimo_agent_kit/skills"

[tool.hatch.build.targets.sdist]
include = ["src", "skills", "tests", "README.md", "LICENSE", "pyproject.toml"]
