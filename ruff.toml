line-length = 130
target-version = "py310"
# Les exemples sont des notebooks marimo, et les démos de wigglystuff et de Studio sont recopiées telles quelles :
# `marimo check` et les essais les contrôlent, pas ruff.
extend-exclude = [
  "tests/exemples",
  "skills/wigglystuff/references/demos",
  "skills/marimo-studio-vues/references/exemples",
  "exemples/meteo-seattle/meteo.py",
]

[lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
